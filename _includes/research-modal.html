<div class="research-modal-overlay" id="researchModalOverlay" onclick="handleResearchModalClick(event)">
  <div class="research-modal-box" role="dialog" aria-modal="true" aria-labelledby="researchModalTitle">
    <div class="research-modal-header">
      <h3 class="research-modal-title" id="researchModalTitle"></h3>
      <button class="research-modal-close" onclick="closeResearchModal()" aria-label="Close">&#x2715;</button>
    </div>
    <div class="research-modal-authors" id="researchModalAuthors"></div>
    <div class="research-modal-divider"></div>
    <div class="research-modal-label">Abstract</div>
    <p class="research-modal-text" id="researchModalText"></p>
    <div class="research-modal-tags" id="researchModalTags"></div>
  </div>
</div>
