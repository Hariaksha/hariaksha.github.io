<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127757;</text></svg>"/>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ page.title | default: site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <!-- Primary Meta -- FIX this SEO / Open Graph stuff later -->
  <meta name="description" content="{{ page.description | default: site.description }}"/>
  <meta name="author" content="Hari Gunda"/>

  <!-- Open Graph (LinkedIn, Facebook, iMessage, Slack) -->
  <meta property="og:type"        content="website"/>
  <meta property="og:url"         content="{{ site.url }}{{ page.url }}"/>
  <meta property="og:title"       content="{{ page.title | default: site.title }}"/>
  <meta property="og:description" content="{{ page.description | default: site.description }}"/>
  <meta property="og:image"       content="https://hariaksha.github.io/assets/img/Headshot.jpg"/>

  <!-- Twitter / X card -->
  <meta name="twitter:card"        content="summary_large_image"/>
  <meta name="twitter:title"       content="{{ page.title | default: site.title }}"/>
  <meta name="twitter:description" content="{{ page.description | default: site.description }}"/>
  <meta name="twitter:image"       content="https://hariaksha.github.io/assets/img/Headshot.jpg"/>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- Scroll Progress Bar -->
<div id="scroll-progress"></div>

<!-- Back to Top -->
<button id="back-to-top" aria-label="Back to top">
  <i class="fas fa-arrow-up"></i>
</button>

<div class="page-layout">
{% include sidebar.html %}

<main class="main-content">
{{ content }}
{% include footer.html %}
</main>
</div>

<script src="/scripts.js"></script>
{% include research-modal.html %}
</body>
</html>
